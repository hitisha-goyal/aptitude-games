<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ultimate Nested Tic Tac Toe Game">
    <title>Ultimate Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        .back-to-hub {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            text-decoration: none;
            color: rgba(255,255,255,0.7);
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(20, 25, 35, 0.6);
            padding: 8px 16px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .back-to-hub:hover {
            background: rgba(0, 242, 255, 0.2);
            color: #00f2ff;
            transform: translateX(-5px);
            border-color: #00f2ff;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-to-hub">← Hub</a>
    <!-- Background Elements -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <!-- Setup Screen -->
    <div id="setup-screen" class="screen active">
        <div class="glass-panel setup-panel">
            <h1 class="title-glow">Nested Tic Tac Toe</h1>
            <p class="subtitle">The Ultimate Strategic Challenge</p>
            
            <div class="input-group">
                <label for="player1">Player 1 <span class="text-p1">(X)</span></label>
                <input type="text" id="player1" placeholder="Enter Player 1 Name" value="Player 1">
            </div>
            
            <div class="input-group">
                <label for="player2">Player 2 <span class="text-p2">(O)</span></label>
                <input type="text" id="player2" placeholder="Enter Player 2 Name" value="Player 2">
            </div>
            
            <div class="input-group type-checkbox">
                <label class="checkbox-container">
                    <input type="checkbox" id="timer-toggle">
                    <span class="checkmark"></span>
                    Enable Turn Timer
                </label>
            </div>
            
            <div class="input-group timer-opts hidden" id="timer-settings">
                <label for="timer-seconds">Seconds per turn</label>
                <input type="number" id="timer-seconds" value="15" min="5" max="60">
            </div>
            
            <button id="start-btn" class="glow-btn"><span>Start Game</span></button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen hidden">
        <div class="game-layout">
            <header class="game-header glass-panel flat">
                <div class="player-info" id="p1-info">
                    <div class="avatar p1-bg">X</div>
                    <span class="name" id="p1-name-display">Player 1</span>
                </div>
                
                <div class="status-center">
                    <div id="turn-indicator" class="turn-badge p1-turn">X's Turn</div>
                    <div id="timer-display" class="timer-badge hidden">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span id="time-left">15</span>s
                    </div>
                </div>
                
                <div class="player-info" id="p2-info">
                    <span class="name" id="p2-name-display">Player 2</span>
                    <div class="avatar p2-bg">O</div>
                </div>
            </header>

            <main class="board-area">
                <div class="main-board" id="main-board">
                    <!-- 9 large grids generated by JS -->
                </div>
            </main>
        </div>
    </div>
    
    <!-- Game Over Modal -->
    <div id="game-over-modal" class="modal hidden">
        <div class="glass-panel text-center result-panel">
            <h2 id="winner-text" class="title-glow">Player Wins!</h2>
            <p id="win-reason" class="mb-4">Won 3 large grids in a row</p>
            <div class="btn-group">
                <button id="restart-btn" class="glow-btn">Play Again</button>
                <button id="menu-btn" class="ghost-btn">Main Menu</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
